[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockthing"
version = "0.1.0"
description = "Stock forecasting from ~120 technical-indicator features with LSTM / GRU / TCN / Transformer / MLP ensembles and walk-forward backtests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stockthing = "stockthing.cli:main"

[tool.setuptools.packages.find]
include = ["stockthing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
